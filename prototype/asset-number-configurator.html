<!doctype html><html lang="th"><meta charset="utf-8"><title>Prototype เลขครุภัณฑ์</title><style>body{font-family:system-ui;margin:40px;background:#f5f7fa;color:#172033}.wrap{max-width:760px;margin:auto}.card{background:#fff;padding:24px;border:1px solid #d9e0ea;border-radius:12px}label{display:block;font-weight:600;margin-top:14px}input{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}.preview{font:700 24px ui-monospace;margin:22px 0;padding:18px;background:#eef5ff;color:#164ea6;border-radius:8px}small{color:#58677d}</style><body><main class="wrap"><h1>ตั้งค่ารูปแบบเลขครุภัณฑ์</h1><p>แม่แบบ: สขส7.7110-006-0001-11/58</p><section class="card"><label>รหัสหน่วยงาน<input id="org" value="สขส7"></label><label>รหัสหมวด<input id="group" value="7110"></label><label>รหัสย่อย<input id="sub" value="006"></label><label>เลขลำดับ<input id="run" type="number" value="1"></label><label>รหัสเพิ่มเติม<input id="suffix" value="11"></label><label>ปีงบประมาณ (2 หลัก)<input id="year" value="58"></label><div class="preview" id="out"></div><small>ตัวอย่างเลขถัดไป 3 รายการ: <span id="next"></span></small></section></main><script>const ids=['org','group','sub','run','suffix','year'];function draw(){let v=ids.map(x=>document.getElementById(x).value),n=+v[3]||1,p=n=>`${v[0]}.${v[1]}-${v[2]}-${String(n).padStart(4,'0')}-${v[4]}/${v[5]}`;out.textContent=p(n);next.textContent=[p(n+1),p(n+2),p(n+3)].join(', ')}ids.forEach(x=>document.getElementById(x).oninput=draw);draw()</script></body></html>
